<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        body{
            background-color: white;

            
        }
        .calcbox{
            background-color: burlywood;
            border: 3px solid black;
            padding: 30px;
            max-width: 500px;
            margin: 100px auto;
            box-shadow: 0 10px 20px black;
        }
        .btn-custom{
            width: 45%;
            margin: 1%;
        }
        .form-control{
            margin-bottom: 15px;
        }
        h2{
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
    <script>
        function add(){
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            var res =  parseInt(num1) + parseInt(num2);
            document.getElementById("res").value = res;
    }
        function sub(){
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            var res =  parseInt(num1) - parseInt(num2);
            document.getElementById("res").value = res;
    }
        function multi(){
           var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            var res =  parseInt(num1) * parseInt(num2);
            document.getElementById("res").value = res;
    }
        function div(){
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            var res =  parseInt(num1) / parseInt(num2);
            document.getElementById("res").value = res;
    }
    </script>
</head>
<body>
    <div class="calcbox">
      <h2>Simple Calculator</h2>
      <input type="text" id="num1" class="form-control" placeholder="Enter First Number" />
      <input type="text" id="num2" class="form-control" placeholder="Enter Second Number" />
      <input type="text" id="res" class="form-control" placeholder="Result" readonly />
  
      <div class="d-flex flex-wrap justify-content-between mt-3">
        <button class="btn btn-info btn-custom" onclick="add()">Addition</button>
        <button class="btn btn-info btn-custom" onclick="sub()">Subtraction</button>
        <button class="btn btn-info btn-custom" onclick="multi()">Multiplication</button>
        <button class="btn btn-info btn-custom" onclick="div()">Division</button>
      </div>
    </div>
  </body>
  </html>
