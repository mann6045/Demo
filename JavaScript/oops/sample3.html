<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    class Person{
        constructor(name, age){
            this.name = name;
            this.age = age
        }
        greet(){
            console.log("Hello !!!!! My name is " + this.name + " and age is " + this.age)
        }
    }

    let p1 = new Person("Mann", 22);
    let p2 = new Person("Nrup", 21);
    p1.greet();
    p2.greet(); 

</script>
<body>
    <h2>JS Classes</h2>
</body>
</html>
