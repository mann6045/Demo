<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let person = {
        name: "MANN",
        age: 21,
        greet: function(){
            console.log("My name is: " + this.name + " and Age is: " + this.age)
        }
    }
    person.greet()
</script>
<body>
    <h2>Object Demo</h2>
</body>
</html>
