<!DOCTYPE html>
<html>
<head>
  <title>JS Objects</title>
</head>
<script>
    let person = {
      firstName: 'John',
      lastName: 'Doe'
    };
    console.log(person.firstName);  
    console.log(person.lastName);   
  
    console.log(person['firstName']); 
    console.log(person['lastName']); 
  
    person.firstName = 'Jane';
    console.log(person); 
  
    person.age = 21;
    console.log(person); 
  
    delete person.age;
    console.log(person); 
    
  </script>
<body>
    <h2>JS Objects</h2>
</body>

</html>
